<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保護ねこカフェ 日向ぼこ</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            color: #5d4037;
            background-color: #fff8e1;
            line-height: 1.6;
        }
        header {
            background-color: #ffa726;
            color: white;
            text-align: center;
            padding: 20px 10px;
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        h2 {
            color: #ef6c00;
            border-bottom: 2px solid #ffe0b2;
            padding-bottom: 10px;
            font-size: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #ef6c00;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 10px;
        }
        .instagram-placeholder {
            background-color: #f5f5f5;
            text-align: center;
            padding: 40px;
            border-radius: 10px;
            color: #888;
        }
        .map-container iframe {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>保護ねこカフェ 日向ぼこ</h1>
        <p>心あたたまる、猫との時間。</p>
    </header>

    <div class="container">
        <section>
            <h2>お店について</h2>
            <p>ここに、お店の紹介文を入れます。猫ちゃんたちと触れ合える癒やしの空間です。</p>
        </section>

        <section>
            <h2>最新の猫ちゃんたち</h2>
            <p>Instagramで毎日更新中！</p>
            <div class="instagram-placeholder">
                ここにインスタの写真がズラッと並びます🐱
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <a href="https://www.instagram.com/" class="btn" target="_blank">Instagramを見る</a>
            </div>
        </section>

        <section>
            <h2>アクセス</h2>
            <p>〒515-0034<br>三重県松阪市南町275-5</p>
            <p>営業時間：12:00 - 19:00<br>定休日：不定休</p>

            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1642.7424235958197!2d136.53391664198736!3d34.566596531845015!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60046b006108efbd%3A0x1886e2879517fec3!2z5L-d6K2344Gt44GT44Kr44OV44KnIOaXpeWQkeOBvOOBkw!5e0!3m2!1sja!2sjp!4v1769823679146!5m2!1sja!2sjp" 
                    width="700" height="350" style="border:0;" allowfullscreen="" loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </div>

    <footer style="text-align: center; padding: 20px; font-size: 12px; color: #888;">
        © 2026 保護ねこカフェ 日向ぼこ
    </footer>
</body>
</html>
