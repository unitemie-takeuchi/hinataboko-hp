<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫カフェ ひなたぼっこ</title>
    <style>
        /* 全体のデザイン設定 */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            color: #5d4037; /* こげ茶色 */
            background-color: #fff8e1; /* クリーム色 */
            line-height: 1.6;
        }

        /* ヘッダー（上の部分） */
        header {
            background-color: #ffa726; /* オレンジ */
            color: white;
            text-align: center;
            padding: 20px 10px;
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        /* メインコンテンツ */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* セクションごとの枠 */
        section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        h2 {
            color: #ef6c00; /* 濃いオレンジ */
            border-bottom: 2px solid #ffe0b2;
            padding-bottom: 10px;
            font-size: 20px;
        }

        /* ボタンのデザイン */
        .btn {
            display: inline-block;
            background-color: #ef6c00;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 10px;
        }

        /* 写真ギャラリー（インスタ埋め込み予定地） */
        .instagram-placeholder {
            background-color: #f5f5f5;
            text-align: center;
            padding: 40px;
            border-radius: 10px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>猫カフェ ひなたぼっこ</h1>
        <p>心あたたまる、猫との時間。</p>
    </header>

    <div class="container">
        <section>
            <h2>お店について</h2>
            <p>ここに、お店の紹介文を入れます。猫ちゃんたちと触れ合える癒やしの空間です。</p>
            <p>※ここは後で竹内さんが書き換えてね！</p>
        </section>

        <section>
            <h2>最新の猫ちゃんたち</h2>
            <p>Instagramで毎日更新中！</p>
            
            <div class="instagram-placeholder">
                ここにインスタの写真がズラッと並びます🐱
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="https://www.instagram.com/" class="btn" target="_blank">Instagramを見る</a>
            </div>
        </section>

        <section>
            <h2>アクセス</h2>
            <p>〒000-0000<br>住所をここに入力</p>
            <p>営業時間：10:00 - 18:00<br>定休日：不定休</p>
        </section>
    </div>

    <footer style="text-align: center; padding: 20px; font-size: 12px; color: #888;">
        &copy; 2026 猫カフェ ひなたぼっこ
    </footer>

</body>
</html>
